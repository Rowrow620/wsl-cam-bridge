[package]
name = "wsl-cam-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"


[dependencies]
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
nokhwa = { version = "0.10.11", features = ["input-native"] }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
tray-icon = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
